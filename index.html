<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALFA TICKET — заявка на билеты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#efeff4;--sec:#fff;--tx:#000;--hint:#8e8e93;--acc:#164C9A;--accT:rgba(22,76,154,.10);--btn:#164C9A;--btx:#fff;--sep:rgba(128,128,128,.22);--wb:rgba(255,170,0,.16);--wt:#8a5a00;--db:rgba(229,57,53,.13);--dt:#c62828;--ob:rgba(52,199,89,.15);--ot:#1f7a35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding-bottom:24px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--sep);color:var(--btx);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ttl{font-size:16px;font-weight:600}
.sub{font-size:12.5px;color:var(--hint);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.langs{margin-left:auto;display:flex;gap:2px}
.lg{border:none;background:transparent;font-size:12px;padding:4px 7px;border-radius:7px;color:var(--hint)}
.lg.on{background:var(--accT);color:var(--acc);font-weight:600}
.sec{background:var(--sec);border-radius:12px;padding:10px 12px;margin:0 10px 10px}
.st{font-size:11.5px;color:var(--hint);margin:0 22px 5px;letter-spacing:.02em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--sep);border-radius:999px;padding:7px 11px;font-size:13px;background:transparent;cursor:pointer}
.chip.on{background:var(--accT);color:var(--acc);border-color:var(--acc)}
.rw{display:flex;align-items:center;justify-content:space-between;padding:7px 0;gap:8px;font-size:14px}
.rw+.rw{border-top:1px solid var(--sep)}
.cn{display:flex;align-items:center;gap:12px}
.cn button{width:32px;height:32px;border-radius:50%;border:1px solid var(--sep);background:transparent;font-size:18px;line-height:1;color:var(--acc)}
.in{border:none;background:transparent;width:100%;font-size:15px;padding:7px 0;outline:none}
.in::placeholder{color:var(--hint)}
.er{font-size:12.5px;color:var(--dt);margin:-4px 22px 8px}
.er:empty{display:none}
.mb{display:block;width:calc(100% - 20px);margin:8px 10px 0;height:48px;border:none;border-radius:12px;background:var(--btn);color:var(--btx);font-weight:600;font-size:15px}
.mb:disabled{opacity:.6}
.sw{width:44px;height:26px;border-radius:13px;background:var(--sep);position:relative;border:none;padding:0;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}.sw.red.on{background:#e53935}
.seg{display:flex;background:var(--sep);border-radius:10px;padding:3px;margin:0 10px 10px;gap:3px}
.seg button{flex:1;border:none;border-radius:8px;height:36px;font-size:14px;background:transparent;color:var(--hint)}
.seg button.on{background:var(--sec);color:var(--tx);font-weight:600}
.soon{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:-2px}.seg button.dis{opacity:.55}
.seg button:has(.soon:not(:empty)){height:40px;line-height:1.15}
.ppl{margin-top:6px;font-size:12px;opacity:.9}
.rw.fl .in{font-size:14px}
.ppm{color:inherit;text-decoration:underline;font-weight:600}
.ppc{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-weight:600;cursor:pointer}.ppc input{width:18px;height:18px;margin:1px 0 0;flex-shrink:0;accent-color:#164C9A}
.nt{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin:0 10px 10px;font-size:13px;line-height:1.45;background:var(--wb);color:var(--wt)}
.sub2{margin-top:8px;padding-top:8px;border-top:1px solid var(--sep)}
.lbl{font-size:12.5px;color:var(--hint);margin-bottom:6px}
.acw{position:relative;flex:1}
.acl{position:absolute;left:-12px;right:-12px;top:100%;z-index:20;background:var(--sec);border:1px solid var(--sep);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:240px;overflow:auto;display:none}
.aci{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--sep);cursor:pointer}
.aci:last-child{border-bottom:none}
.df{display:flex;align-items:center;gap:8px;flex:1}
.df .in{letter-spacing:.03em}
.cal{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--accT);color:var(--acc);flex-shrink:0;font-size:17px}
.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.dh{font-size:12px;color:var(--hint);margin:-2px 0 4px}
.dh.bad{color:var(--dt)}
.leg{border:1px solid var(--sep);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.legh{display:flex;justify-content:space-between;font-size:12px;color:var(--hint)}
.lnk{border:none;background:transparent;color:var(--acc);font-size:14px;padding:6px 0}
.more{display:flex;align-items:center;gap:6px;margin:2px 16px 10px;border:none;background:transparent;color:var(--acc);font-size:14px;padding:6px 2px}
select{border:1px solid var(--sep);background:transparent;border-radius:8px;height:32px;padding:0 8px;font-size:14px}
.ok{padding:40px 18px 10px;text-align:center}
.oki{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:34px}
.okt{font-size:19px;font-weight:600}
.oks{font-size:14px;color:var(--hint);margin:8px 0 12px;line-height:1.5}
.qr{width:min(78vw,300px);height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;border-radius:12px;background:#fff;padding:8px;display:block;margin:6px auto;cursor:zoom-in}
.qrfull{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.qrfull img{width:min(92vw,92vh);height:auto;image-rendering:pixelated}
.qrfull div{color:#555;font-size:14px}
.center{padding:60px 24px;text-align:center;color:var(--hint)}
.obh{font-size:18px;font-weight:700;margin-bottom:6px}
.obt{font-size:14px;line-height:1.5;color:var(--hint)}
.obw{font-size:12.5px;color:var(--hint);text-align:center;margin:10px 24px 0;line-height:1.45}
.ft{display:flex;justify-content:center;gap:4px;margin:14px 10px 0;flex-wrap:wrap}
.ft button{border:none;background:transparent;color:var(--acc);font-size:13.5px;padding:8px 10px;border-radius:9px}
.qa{border-top:1px solid var(--sep)}.qa:first-child{border-top:none}
.qa summary{list-style:none;padding:11px 0;font-size:14.5px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.qa summary::-webkit-details-marker{display:none}.qa summary::after{content:"▾";color:var(--hint)}.qa[open] summary::after{content:"▴"}
.qa div{font-size:14px;line-height:1.5;color:var(--hint);padding:0 0 12px}
.pl{font-size:14px;line-height:1.6}.pl a{color:var(--acc)}
.mb.out{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.mb.red{background:transparent;color:var(--dt);border:1px solid var(--dt)}
.how{margin:0 10px 10px;border-radius:12px;padding:10px 12px;background:var(--accT);font-size:13px;line-height:1.45}
.how b{display:block;margin-bottom:4px;color:var(--acc)}.how ol{margin:0;padding-left:18px}.how li{margin:2px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div id="loading" class="center">…</div>
<div id="fatal" class="center hide"></div>
<div id="ob" class="hide">
  <div class="top">
    <div class="logo"><img src="logo.png" alt="ALFA TICKET" style="width:100%;height:100%;object-fit:contain;border-radius:12px" onerror="this.parentNode.textContent='✈️'"></div>
    <div style="min-width:0"><div class="ttl">ALFA TICKET</div><div class="sub" data-i="obSub"></div></div>
    <div class="langs"><button class="lg" data-l="ru">RU</button><button class="lg" data-l="uz">UZ</button><button class="lg" data-l="en">EN</button></div>
  </div>
  <div class="sec" style="padding:14px"><div class="obh" data-i="obTitle"></div><div class="obt" data-i="obText"></div></div>
  <div class="sec"><label class="ppc" style="margin:2px 0;font-weight:400;font-size:14px;line-height:1.45"><input type="checkbox" id="obOk"><span><span data-i="obConsent"></span> <a href="#" id="obPol" class="ppm" data-i="obPolicy"></a></span></label></div>
  <div class="er" id="eOb"></div>
  <button class="mb" id="obBtn" data-i="obPhone"></button>
  <div class="obw" data-i="obWhy"></div>
  <div class="ft"><button data-pn="faq" data-i="fFaq"></button><button data-pn="mgr" data-i="fMgr"></button></div>
</div>
<div id="pn" class="hide">
  <div class="top"><div class="ttl" id="pnT"></div></div>
  <div id="pnB"></div>
</div>
<div id="form" class="hide">
  <div class="top">
    <div class="logo" id="logo"><img src="logo.png" alt="ALFA TICKET" style="width:100%;height:100%;object-fit:contain;border-radius:12px" onerror="this.parentNode.textContent='✈️'"></div>
    <div style="min-width:0">
      <div class="ttl"><span data-i="hTitle"></span> · <span id="company">ALFA TICKET</span></div>
      <div class="sub"><span class="dot" id="dot"></span><span id="hs"></span></div>
    </div>
    <div class="langs"><button class="lg" data-l="ru">RU</button><button class="lg" data-l="uz">UZ</button><button class="lg" data-l="en">EN</button></div>
  </div>

  <div class="seg" id="mode"><button class="on" data-m="pl">✈️ <span data-i="plane"></span></button><button data-m="tr">🚆 <span data-i="train"></span><small id="trSoon" class="soon" data-i="soon"></small></button></div>
  <div class="nt hide" id="trSoonNote"><span>🚆</span><div data-i="soonNote"></div></div>
  <div class="nt" data-only="tr"><span>⏱️</span><div data-i="trainNote"></div></div>

  <div class="sec" id="urgBox" style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">⏰</span>
    <div style="flex:1"><div style="font-size:14px;font-weight:600" data-i="urg"></div><div style="font-size:12px;color:var(--hint)" data-i="urgSub"></div></div>
    <button class="sw red" id="urg" aria-label="urgent"></button>
  </div>

  <div class="st" data-i="sRoute"></div>
  <div class="sec">
    <div class="chips" id="trip" style="margin-bottom:6px"><button class="chip on" data-v="rt" data-i="rt"></button><button class="chip" data-v="ow" data-i="ow"></button><button class="chip" data-v="mc" data-only="pl" data-i="mc"></button></div>
    <div id="simple">
      <div class="rw"><span style="color:var(--hint)">●</span><div class="acw"><input class="in ac" id="from" data-p="pFrom" autocomplete="off"></div></div>
      <div class="rw"><span style="color:var(--acc)">📍</span><div class="acw"><input class="in ac" id="to" data-p="pTo" autocomplete="off"></div></div>
      <div class="rw"><span style="color:var(--hint);min-width:70px" data-i="dTo"></span><div class="df" id="df1"></div></div>
      <div class="dh" id="dh1"></div>
      <div class="rw fl"><span style="color:var(--hint);min-width:70px;font-size:13px">🕘</span><input class="in" id="fl1" data-p="pFl" maxlength="40" autocomplete="off"></div>
      <div id="d2w"><div class="rw" style="border-top:1px solid var(--sep)"><span style="color:var(--hint);min-width:70px" data-i="dBack"></span><div class="df" id="df2"></div></div><div class="dh" id="dh2"></div><div class="rw fl"><span style="color:var(--hint);min-width:70px;font-size:13px">🕘</span><input class="in" id="fl2" data-p="pFl" maxlength="40" autocomplete="off"></div></div>
    </div>
    <div id="multi" class="hide"><div id="legs"></div><button class="lnk" id="addLeg" data-i="addLeg"></button></div>
    <div class="rw"><span style="font-size:13px" data-i="flex"></span><button class="sw" id="flx" aria-label="flex"></button></div>
  </div>
  <div class="er" id="e1"></div>

  <div class="nt" data-only="pl"><span>🪪</span><div><b data-i="ppT"></b><br><span data-i="ppB"></span> <span id="pp"></span>
    <label class="ppc"><input type="checkbox" id="ppOk"><span><span data-i="ppC"></span> <a href="#" id="ppMore" class="ppm" data-i="ppM"></a></span></label>
    <div class="ppl hide" id="ppL" data-i="ppL"></div></div></div>
  <div class="er" id="e7" data-only="pl"></div>

  <div class="st" data-i="sPax"></div>
  <div class="sec">
    <div class="rw"><span><span data-i="adults"></span> <span style="color:var(--hint);font-size:12px">12+</span></span><div class="cn"><button data-c="ad" data-d="-1">−</button><b id="ad">1</b><button data-c="ad" data-d="1">+</button></div></div>
    <div class="rw"><span><span data-i="kids"></span> <span style="color:var(--hint);font-size:12px" data-i="u12"></span></span><div class="cn"><button data-c="ch" data-d="-1">−</button><b id="ch">0</b><button data-c="ch" data-d="1">+</button></div></div>
    <div id="ages"></div>
  </div>
  <div class="er" id="e2"></div>

  <div data-only="pl"><div class="st" data-i="sFare"></div>
    <div class="sec"><div class="chips" id="fare"><button class="chip" data-v="bag" data-i="bag"></button><button class="chip" data-v="nobag" data-i="nobag"></button></div></div>
    <div class="er" id="e3"></div></div>

  <div class="st" data-i="sCls"></div>
  <div class="sec">
    <div class="chips" id="cls" data-only="pl"><button class="chip" data-v="eco" data-i="eco"></button><button class="chip" data-v="bus" data-i="bus"></button><button class="chip" data-v="first" data-i="first"></button></div>
    <div class="chips" id="tcls" data-only="tr"><button class="chip" data-v="eco" data-i="eco"></button><button class="chip" data-v="bus" data-i="bus"></button><button class="chip" data-v="vip">VIP</button></div>
  </div>
  <div class="er" id="e4"></div>

  <div class="st" data-i="sPref"></div>
  <div class="sec">
    <div data-only="pl"><div class="chips" id="dir"><button class="chip" data-v="direct" data-i="direct"></button><button class="chip" data-v="via" data-i="via"></button></div>
      <div id="layW" class="sub2 hide"><div class="lbl" data-i="lay"></div><div class="chips" id="lay"><button class="chip" data-v="3" data-i="l3"></button><button class="chip" data-v="6" data-i="l6"></button><button class="chip on" data-v="any" data-i="lAny"></button></div></div>
      <div class="sub2"></div></div>
    <div class="lbl" data-i="time"></div><div class="chips" id="tm"><button class="chip" data-v="m" data-i="m"></button><button class="chip" data-v="d" data-i="d"></button><button class="chip" data-v="e" data-i="e"></button></div>
  </div>

  <div data-only="tr"><div class="st" data-i="sTrain"></div>
    <div class="sec"><div class="chips" id="tt"><button class="chip" data-v="afr" data-i="afr"></button><button class="chip" data-v="sharq" data-i="sharq"></button><button class="chip on" data-v="any" data-i="tAny"></button></div>
      <div class="rw sub2"><span style="font-size:13px" data-i="fallback"></span><button class="sw on" id="fb" aria-label="fallback"></button></div></div></div>

  <div class="how"><b data-i="howT"></b><ol><li data-i="how1"></li><li data-i="how2"></li><li data-i="how3"></li><li data-i="how4"></li></ol></div>
  <div class="st" data-i="sPay"></div>
  <div class="sec"><div class="chips" id="pay"><button class="chip" data-v="cash">💵 <span data-i="cash"></span></button><button class="chip" data-v="qr">📱 <span data-i="qr"></span></button></div>
    <div id="payH" class="hide" style="font-size:12.5px;color:var(--hint);margin-top:8px"></div></div>
  <div class="er" id="e5"></div>

  <button class="more" id="more">⚙️ <span id="moreT"></span> <span id="moreI">▾</span></button>
  <div id="moreBox" class="hide">
    <div data-only="pl"><div class="st" data-i="sAdd"></div>
      <div class="sec"><div class="chips" id="add"><button class="chip" data-v="seat">💺 <span data-i="seat"></span></button><button class="chip" data-v="xbag">🧳 <span data-i="xbag"></span></button><button class="chip" data-v="fast">⚡ <span data-i="fast"></span></button><button class="chip" data-v="ins">🛡️ <span data-i="ins"></span></button><button class="chip" data-v="upg">⬆️ <span data-i="upg"></span></button></div>
        <div id="seatW" class="sub2 hide"><div class="lbl" data-i="seatQ"></div><div class="chips" id="seatP"><button class="chip" data-v="w" data-i="sW"></button><button class="chip" data-v="a" data-i="sA"></button><button class="chip" data-v="t" data-i="sT"></button></div></div>
      </div></div>
    <div class="st" data-i="sTour"></div>
    <div class="sec"><div class="chips" id="ex"><button class="chip" data-v="hotel">🏨 <span data-i="hotel"></span></button><button class="chip" data-v="tr">🚗 <span data-i="tr"></span></button><button class="chip" data-v="visa" data-only="pl">🛂 <span data-i="visa"></span></button></div></div>

  <div class="er" id="e6" style="margin-top:6px"></div>
  <button class="mb" id="send" data-i="send"></button>
  <div class="ft"><button data-pn="faq" data-i="fFaq"></button><button data-pn="mgr" data-i="fMgr"></button><button data-pn="priv" data-i="fPriv"></button></div>
</div>

<div id="ok" class="ok hide">
  <div class="oki" id="okI"></div>
  <div class="okt" id="okT"></div>
  <div class="oks" id="okS"></div>
  <div class="oks" id="okP" style="margin-top:0"></div>
  <div class="nt" style="margin:4px 0 0;text-align:left" data-i="okHow"></div>
  <button class="mb" id="again" style="margin:16px 0 0;width:100%" data-i="close"></button>

<script>
// === НАСТРОЙКА: ссылка на веб-приложение Apps Script таблицы «ALFA Заявки физлица» ===
const API = 'https://script.google.com/macros/s/AKfycbzpAoItAvYMVZmgXpJfSOSuKcERbnykpRFjndaxuex8HxExAyhxDsgvnausSpK8L12pfg/exec';
// =====================================================================

const FAQ = {"ru": [["💰 Сколько стоят ваши услуги?", "Заявка и подбор вариантов бесплатные. Сервисный сбор — по нашему прайсу, менеджер назовёт его вместе с ценой билета. Итоговую сумму менеджер называет до оплаты, без скрытых доплат."], ["📈 Почему цена на билет меняется?", "Авиакомпании продают места по разным тарифам. Когда дешёвые места заканчиваются, цена растёт, иногда за несколько часов. Цену фиксирует бронь (если авиакомпания её позволяет) или выписка билета, поэтому лучше не откладывать."], ["📌 Можно забронировать без оплаты?", "Да, если авиакомпания и тариф это позволяют. Мы бронируем выбранный перелёт, и места с ценой сохраняются до срока брони — его назовёт менеджер. После оплаты выдаём электронный билет. Если не оплатить до срока, бронь снимается автоматически."], ["🧳 «С багажом» и «без багажа»", "«Без багажа» — только ручная кладь, её вес и размер зависят от авиакомпании. «С багажом» — ещё и чемодан в багажном отделении. Точные нормы менеджер укажет в каждом варианте."], ["↩️ Возврат и обмен билета", "Зависит от тарифа. Возвратные тарифы дороже, зато деньги можно вернуть (иногда за вычетом сбора). По невозвратным тарифам вернуть удаётся только часть или ничего. Условия менеджер сообщит до оплаты."], ["🛂 Какие данные нужны для покупки?", "ФИО латиницей как в паспорте, номер и срок действия паспорта, дата рождения каждого пассажира. Присылайте их только после того, как выберете вариант."], ["📅 Сколько должен действовать паспорт?", "Обычно не меньше 6 месяцев после возвращения. Многие страны не пускают с паспортом, который скоро истекает, — проверьте заранее."], ["👶 Билеты для детей", "Младенцы до 2 лет обычно летят без отдельного места и стоят дешевле. Для детей от 2 до 12 лет у многих авиакомпаний скидка. Укажите в форме возраст каждого ребёнка — менеджер посчитает точно."], ["🎫 Как я получу билет?", "Электронный билет придёт в этот чат файлом. Распечатывать не нужно, в аэропорту достаточно паспорта."], ["🖥 Что такое онлайн-регистрация?", "Регистрация на рейс на сайте авиакомпании, обычно за 24–48 часов до вылета. Она экономит время в аэропорту и даёт выбрать место. Если не получается — напишите нам, поможем."], ["🌍 Поможете с визой и отелем?", "Визы, отели, трансферы и туры оформляет наш партнёр ALFA TOUR. Напишите менеджеру — передадим ваш запрос."], ["⏱ Как быстро вы отвечаете?", "В рабочее время (Пн–Пт 10–18, Сб 10–16) — в течение 15 минут. Вечером, ночью и в выходные мы тоже на связи. Если вылет сегодня — отметьте «Срочно»."]], "uz": [["💰 Xizmatlaringiz qancha turadi?", "Ariza va variantlarni tanlash bepul. Xizmat haqi — narxlarimiz ro‘yxatiga ko‘ra, menejer uni chipta narxi bilan birga aytadi. Yakuniy summa to‘lovdan oldin, yashirin to‘lovlarsiz aytiladi."], ["📈 Nega chipta narxi o‘zgaradi?", "Aviakompaniyalar joylarni turli tariflarda sotadi. Arzon joylar tugagach, narx oshadi — ba’zan bir necha soat ichida. Narxni bron (agar aviakompaniya ruxsat bersa) yoki chiptani rasmiylashtirish qayd etadi, shuning uchun kechiktirmagan ma’qul."], ["📌 To‘lovsiz bron qilsa bo‘ladimi?", "Ha, agar aviakompaniya va tarif ruxsat bersa. Tanlangan parvozni bron qilamiz, joylar va narx bron muddatigacha saqlanadi — muddatni menejer aytadi. To‘lovdan so‘ng elektron chipta beramiz. Muddatgacha to‘lanmasa, bron avtomatik bekor bo‘ladi."], ["🧳 «Bagajli» va «bagajsiz»", "«Bagajsiz» — faqat qo‘l yuki, uning vazni va o‘lchami aviakompaniyaga bog‘liq. «Bagajli» — qo‘shimcha ravishda bagaj bo‘limiga topshiriladigan chamadon. Aniq me’yorlarni menejer har bir variantda ko‘rsatadi."], ["↩️ Chiptani qaytarish va almashtirish", "Tarifga bog‘liq. Qaytariladigan tariflar qimmatroq, lekin pulni qaytarish mumkin (ba’zan jarima ushlab qolinadi). Qaytarilmaydigan tariflarda pulning faqat bir qismi qaytadi yoki umuman qaytmaydi. Shartlarni menejer to‘lovdan oldin aytadi."], ["🛂 Xarid uchun qanday ma’lumotlar kerak?", "Har bir yo‘lovchining pasportdagidek lotin harflarida F.I.Sh., pasport raqami va amal qilish muddati, tug‘ilgan sanasi. Ularni faqat variantni tanlaganingizdan keyin yuboring."], ["📅 Pasport qancha amal qilishi kerak?", "Odatda qaytgandan keyin kamida 6 oy. Ko‘p davlatlar muddati tugayotgan pasport bilan kiritmaydi — oldindan tekshiring."], ["👶 Bolalar uchun chiptalar", "2 yoshgacha bo‘lgan go‘daklar odatda alohida joysiz uchadi va arzonroq turadi. 2 yoshdan 12 yoshgacha bo‘lgan bolalarga ko‘p aviakompaniyalarda chegirma bor. Shaklda har bir bolaning yoshini ko‘rsating — menejer aniq hisoblaydi."], ["🎫 Chiptani qanday olaman?", "Elektron chipta shu chatga fayl ko‘rinishida keladi. Chop etish shart emas, aeroportda pasport kifoya."], ["🖥 Onlayn ro‘yxatdan o‘tish nima?", "Aviakompaniya saytida reysga ro‘yxatdan o‘tish, odatda parvozdan 24–48 soat oldin. U aeroportda vaqtni tejaydi va joy tanlash imkonini beradi. Uddalay olmasangiz — bizga yozing, yordam beramiz."], ["🌍 Viza va mehmonxonada yordam berasizmi?", "Viza, mehmonxona, transfer va turlarni hamkorimiz ALFA TOUR rasmiylashtiradi. Menejerga yozing — so‘rovingizni yetkazamiz."], ["⏱ Qanchalik tez javob berasiz?", "Ish vaqtida (Du–Ju 10–18, Sh 10–16) — 15 daqiqa ichida. Kechqurun, tunda va dam olish kunlari ham aloqadamiz. Parvoz bugun bo‘lsa — «Shoshilinch» deb belgilang."]], "en": [["💰 How much do your services cost?", "Requests and finding options are free. The service fee follows our price list, and the manager states it together with the ticket price. You get the final amount before paying, with no hidden extras."], ["📈 Why does the ticket price change?", "Airlines sell seats at different fares. When the cheaper seats run out, the price goes up, sometimes within hours. The price is locked by a booking (if the airline allows it) or by issuing the ticket, so it’s best not to wait."], ["📌 Can I book without paying?", "Yes, if the airline and fare allow it. We book your chosen flight, and the seats and price are held until the booking deadline — the manager will tell you when. After payment we issue your e-ticket. If it isn’t paid by the deadline, the booking is cancelled automatically."], ["🧳 “With baggage” vs “no baggage”", "“No baggage” means carry-on only; its weight and size depend on the airline. “With baggage” adds a checked suitcase. The manager lists the exact allowances for each option."], ["↩️ Refunds and changes", "It depends on the fare. Refundable fares cost more, but you can get your money back (sometimes minus a fee). With non-refundable fares, only part of the money or nothing is returned. The manager explains the rules before you pay."], ["🛂 What details do you need?", "Each passenger’s full name in Latin letters exactly as in the passport, passport number and expiry date, and date of birth. Please send them only after you’ve chosen an option."], ["📅 How long must my passport be valid?", "Usually at least 6 months after your return. Many countries refuse entry with a passport that is about to expire — check in advance."], ["👶 Tickets for children", "Infants under 2 usually fly without their own seat and cost less. Many airlines give discounts for children aged 2 to 12. Enter each child’s age in the form, and the manager will calculate the exact price."], ["🎫 How will I get my ticket?", "Your e-ticket arrives in this chat as a file. No need to print it — your passport is enough at the airport."], ["🖥 What is online check-in?", "Checking in for your flight on the airline’s website, usually 24–48 hours before departure. It saves time at the airport and lets you choose a seat. If it doesn’t work, message us and we’ll help."], ["🌍 Can you help with visas and hotels?", "Visas, hotels, transfers and tours are handled by our partner ALFA TOUR. Message a manager and we’ll pass your request on."], ["⏱ How fast do you reply?", "During working hours (Mon–Fri 10–18, Sat 10–16) — within 15 minutes. We’re also available in the evening, at night and on weekends. If you’re flying today, mark your request “Urgent”."]]};

// ---------- Время Ташкента ----------
function tashParts() {
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(now);
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.find(x => x.type === 'weekday').value);
  const h = (+p.find(x => x.type === 'hour').value % 24) + (+p.find(x => x.type === 'minute').value) / 60;
  return { date, wd, h };
}
function period() {
  const { date, wd, h } = tashParts();
  if (h < 9) return 'night';
  if (HOL.includes(date)) return 'eve';
  if ((wd >= 1 && wd <= 5 && h >= 10 && h < 18) || (wd === 6 && h >= 10 && h < 16)) return 'open';
  return 'eve';
}
function today() { return new Date(tashParts().date + 'T00:00:00'); }

// ---------- Даты ----------
function mask(v) { const d = v.replace(/\D/g, '').slice(0, 8); let o = d.slice(0, 2); if (d.length > 2) o += '.' + d.slice(2, 4); if (d.length > 4) o += '.' + d.slice(4); return o; }
function parseD(v) { const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v || ''); if (!m) return null; const d = new Date(+m[3], +m[2] - 1, +m[1]); return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? d : null; }
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmt = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
function dateField(holder, onChange) {
  holder.innerHTML = '<input class="in" inputmode="numeric" maxlength="10"><label class="cal">📅<input type="date" tabindex="-1"></label>';
  const tx = holder.querySelector('.in'), c = holder.querySelector('input[type=date]');
  tx.placeholder = T[L].dPh;
  tx.addEventListener('input', () => { tx.value = mask(tx.value); onChange(); });
  c.addEventListener('change', () => { if (c.value) { const [y, m, d] = c.value.split('-'); tx.value = d + '.' + m + '.' + y; onChange(); } });
  return { tx, c };
}
function dateHint(el, v, min) {
  el.className = 'dh'; el.textContent = '';
  if (!v) return true;
  if (v.length < 10) return false;
  const d = parseD(v), t = T[L];
  if (!d) { el.textContent = t.bad; el.className = 'dh bad'; return false; }
  if (d < today()) { el.textContent = t.past; el.className = 'dh bad'; return false; }
  if (min && d < min) { el.textContent = t.order; el.className = 'dh bad'; return false; }
  el.textContent = t.wd[d.getDay()] + ', ' + d.getDate() + ' ' + t.mo[d.getMonth()] + ' ' + d.getFullYear();
  return true;
}

function attachAC(inp) {
  const list = document.createElement('div'); list.className = 'acl'; inp.parentNode.appendChild(list);
  const li = { ru: 0, uz: 1, en: 2 };
  const show = () => {
    const q = inp.value.trim().toLowerCase(); const src = M === 'tr' ? ST : PL;
    if (q.length < 2) { list.style.display = 'none'; return; }

  if (T[QP.get('l')]) L = QP.get('l'); // язык из бота
  if (tg) { tg.ready(); tg.expand(); }
  $('loading').textContent = { ru: 'Загрузка…', uz: 'Yuklanmoqda…', en: 'Loading…' }[L];
  if (!tg || !tg.initData) return fatal(T[L].eAuth);
  const u = tg.initDataUnsafe.user || {};
  REGKEY = 'alfa_reg_' + (u.id || '');
  SRC = (QP.get('src') || tg.initDataUnsafe.start_param || '').slice(0, 40);
  const sp = tg.initDataUnsafe.start_param || '';
  wantTrain = QP.get('m') === 'tr' || /^tr(ain)?(_|$)/i.test(sp);

  // Общие кнопки
  qs('.lg').forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem('alfa_lang', L); } catch (e) {} tr(); okFill(); renderPanel(); });
  qs('[data-pn]').forEach(b => b.onclick = () => openPanel(b.dataset.pn));
  try { tg.BackButton.onClick(closePanel); } catch (e) {}
  $('obBtn').onclick = register;
  $('obPol').onclick = e => { e.preventDefault(); openLink(POLICY_URL + '?l=' + L); };
  $('obOk').onchange = () => { $('eOb').textContent = ''; };
  tr();

  const view = QP.get('v');
  if (isReg()) {
    await showForm();
  } else {
    show('ob');
    buildForm(); // справочники грузятся в фоне, пока клиент читает
  }
  if (view === 'faq' || view === 'mgr' || view === 'priv') openPanel(view);

  // Фоновая сверка с сервером: согласие могли отозвать или дать с другого устройства
  api({ kind: 'status' }).then(j => {
    if (!j || !j.ok) return;
    if (j.reg && !isReg()) { setReg(true); if (cur === 'ob') showForm(); }
    else if (!j.reg && isReg()) { setReg(false); if (cur === 'form') show('ob'); }
  }).catch(() => {});
}
init();
</script>
</body>
</html>
