<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALFA TICKET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--sec:#fff;--tx:#0F1B2D;--hint:#5A6678;--acc:#164C9A;--navy:#0B2C5E;--sky:#3D7DD8;--accT:#EEF3FA;--gold:#F5B21A;--btn:#164C9A;--btx:#fff;--sep:#DCE3EE;--wb:#FFF5DC;--wt:#7A5200;--db:#FDECEC;--dt:#C0362C;--ob:#E7F4EC;--ot:#187A4C;--sh:0 8px 28px rgba(11,44,94,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.4 Montserrat,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.scr{min-height:100vh;padding-bottom:24px}
.hide{display:none!important}

/* анимации */
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{0%{transform:translate(-30px,18px) rotate(-8deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(min(300px,75vw),-26px) rotate(-14deg);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,122,76,.45)}70%{box-shadow:0 0 0 8px rgba(24,122,76,0)}100%{box-shadow:0 0 0 0 rgba(24,122,76,0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(1);opacity:.5}to{transform:scale(1.7);opacity:0}}
@keyframes tear{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes zoom{from{transform:scale(1.06);opacity:0}to{transform:none;opacity:1}}
@keyframes shim{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
.up1{animation:up .55s ease-out both .05s}.up2{animation:up .55s ease-out both .18s}.up3{animation:up .55s ease-out both .3s}.up4{animation:up .55s ease-out both .42s}
.fly{animation:fly 6s ease-in-out infinite}
.pulse{animation:pulse 2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* общие элементы */
.mb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border:none;border-radius:12px;background:var(--btn);color:var(--btx);font-weight:700;font-size:15px;transition:transform .12s,opacity .12s}
.mb:active{transform:scale(.98)}
.mb:disabled{opacity:.6}
.mb.out{background:#fff;color:var(--acc);border:1px solid var(--sep);height:48px;font-weight:600;font-size:14px}
.mb.red{background:#fff;color:var(--dt);border:1px solid var(--sep);height:48px;font-weight:600;font-size:14px}
.bot{padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px}
.free{text-align:center;font-size:12px;color:var(--hint)}
.er{font-size:12.5px;color:var(--dt);margin:-2px 22px 10px;font-weight:600}
.er:empty{display:none}
.lnk{border:none;background:transparent;color:var(--acc);font-size:14px;font-weight:600;padding:6px 0}
.ph{padding:20px 22px 4px}
.stp{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--hint);text-transform:uppercase}
.ph h1{margin:6px 0 0;font-size:25px;line-height:31px;font-weight:800;letter-spacing:-.01em}
.phs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hint);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.langs{display:flex;gap:2px}
.lg{border:none;background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 8px;border-radius:6px;opacity:.75}
.lg.on{background:rgba(255,255,255,.28);opacity:1}
.ft{display:flex;justify-content:center;gap:4px;margin:16px 10px 0;flex-wrap:wrap}
.ft button{border:none;background:transparent;color:var(--acc);font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px}
.center{padding:80px 24px;text-align:center;color:var(--hint)}
.splash{position:fixed;inset:0;z-index:50;background:var(--acc);color:#D6E2F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;font-size:13px;font-weight:600;letter-spacing:.04em}
.slogo{width:150px;height:auto;animation:up .6s ease-out both}
.ldp{width:min(320px,80vw)}.ldp svg{width:100%;height:auto;overflow:visible;display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* главная */
.hero{background:var(--acc);color:#fff;padding:18px 22px 76px;position:relative;overflow:hidden}
.hpath{position:absolute;left:0;top:40px;width:100%;height:auto;overflow:visible}
.hrow{display:flex;align-items:center;gap:12px;position:relative}
.hlogo{height:34px;width:auto;display:block}
.hrow .langs{margin-left:auto}
.hi{margin-top:24px;font-size:14px;color:#D6E2F4;position:relative;min-height:20px}
.hq{margin:6px 0 0;font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.01em;position:relative}
.scard{margin:-54px 16px 0;border-radius:16px;background:#fff;box-shadow:0 8px 28px rgba(11,44,94,.14);padding:6px;position:relative}
.tabs{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--accT)}
.tabs button{flex:1;height:38px;border:none;border-radius:8px;background:transparent;color:var(--hint);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(11,44,94,.12)}
.od{padding:14px 10px 12px;display:flex;align-items:center;gap:10px}
.odc{flex:1;min-width:0;border:none;background:transparent;padding:0;text-align:left}
.odc.r{text-align:right}
.odl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--hint);text-transform:uppercase}
.odv{font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--acc);margin-top:2px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odv.city{font-size:19px;letter-spacing:0}
.odv.empty{color:#B7C3D6}
.ods{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swp{width:38px;height:38px;border-radius:50%;border:1px solid var(--sep);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:transform .3s}
.swp.spin{transform:rotate(180deg)}
.hins{padding:14px 10px 12px;display:flex;gap:12px;align-items:center}
.hins img{height:22px;width:auto}
.hins div{font-size:12.5px;line-height:18px;color:var(--hint)}
.trust{margin:14px 16px 0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--hint)}
.trust b{color:var(--acc)}
.trust .sp{color:#B7C3D6}
.trust .live{display:flex;align-items:center;gap:6px}
.trust .g{width:8px;height:8px;border-radius:50%;background:var(--ot)}
.sh{padding:24px 22px 10px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;scrollbar-width:none;scroll-padding-left:16px}
.car::-webkit-scrollbar{display:none}
.nc{flex:0 0 78%;max-width:340px;scroll-snap-align:start;border:none;padding:0;text-align:left;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(11,44,94,.10)}
.nc img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block;background:var(--accT)}
.nc div{padding:10px 12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:#C9D3E2;transition:width .3s,background .3s}
.dots i.on{width:18px;background:var(--acc)}
.pop{padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pop button{text-align:left;border-radius:12px;border:1px solid var(--sep);background:#fff;padding:12px 14px;transition:transform .12s}
.pop button:active{transform:scale(.97)}
.pop b{display:block;font-size:18px;font-weight:800;letter-spacing:.04em;color:var(--acc)}
.pop span{display:block;font-size:14px;font-weight:600;margin-top:4px}
.corp{display:block;width:calc(100% - 32px);margin:18px 16px 0;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--sep);font-size:12.5px;line-height:18px;color:var(--hint);text-align:left}
.corp b{color:var(--navy)}
.corp .all{display:block;margin-top:8px;color:var(--tx)}

/* новость */
.nimg{overflow:hidden;background:var(--accT)}
.nimg img{width:100%;height:auto;display:block;animation:zoom .7s ease-out both}
.npad{padding:18px 22px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;background:var(--gold);color:var(--navy);letter-spacing:.04em}
.npad h1{margin:10px 0 0;font-size:23px;line-height:29px;font-weight:800}
.nroute{margin:16px 16px 0;border-radius:14px;background:var(--accT);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nroute b{font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--acc)}
.nroute span{font-size:12px;color:var(--hint);text-align:center}
.npick{margin:14px 16px 0}
.npick .lbl{font-size:12.5px;color:var(--hint);margin-bottom:8px}
.nnote{margin:12px 22px 0;font-size:12px;color:var(--hint)}

/* форма */
.sec{background:var(--sec);border-radius:14px;padding:10px 14px;margin:0 16px 12px;box-shadow:0 1px 2px rgba(11,44,94,.04);border:1px solid #E8EDF5}
.st{font-size:11px;font-weight:700;color:var(--hint);margin:16px 24px 7px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--sep);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;background:#fff;transition:background .15s,border-color .15s,color .15s}
.chip.on{background:var(--accT);color:var(--acc);border-color:var(--acc);font-weight:700}
.rw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:8px;font-size:14px}
.rw+.rw{border-top:1px solid #EDF1F7}
.cn{display:flex;align-items:center;gap:12px}
.cn button{width:34px;height:34px;border-radius:50%;border:1px solid var(--sep);background:#fff;font-size:18px;line-height:1;color:var(--acc)}
.cn b{min-width:14px;text-align:center}
.in{border:none;background:transparent;width:100%;font-size:15px;padding:7px 0;outline:none;font-weight:500}
.in::placeholder{color:#97A3B6;font-weight:400}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sep);position:relative;border:none;padding:0;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}.sw.red.on{background:#D64545}
.seg{display:flex;background:var(--accT);border-radius:10px;padding:4px;margin:14px 16px 12px;gap:4px}
.seg button{flex:1;border:none;border-radius:8px;height:38px;font-size:13px;font-weight:600;background:transparent;color:var(--hint)}
.seg button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(11,44,94,.12)}
.soon{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:-2px}.seg button.dis{opacity:.55}
.ppl{margin-top:6px;font-size:12px;opacity:.9}
.rw.fl .in{font-size:14px}
.ppm{color:inherit;text-decoration:underline;font-weight:600}
.ppc{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-weight:600;cursor:pointer}.ppc input{width:18px;height:18px;margin:1px 0 0;flex-shrink:0;accent-color:#164C9A}
.nt{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:11px 13px;margin:0 16px 12px;font-size:13px;line-height:1.45;background:var(--wb);color:var(--wt)}
.sub2{margin-top:8px;padding-top:8px;border-top:1px solid #EDF1F7}
.lbl{font-size:12.5px;color:var(--hint);margin-bottom:7px}
.acw{position:relative;flex:1}
.acl{position:absolute;left:-14px;right:-14px;top:100%;z-index:20;background:#fff;border:1px solid var(--sep);border-radius:12px;box-shadow:0 10px 28px rgba(11,44,94,.18);max-height:240px;overflow:auto;display:none}
.aci{padding:11px 14px;font-size:14px;border-bottom:1px solid #EDF1F7;cursor:pointer}
.aci:last-child{border-bottom:none}
.df{display:flex;align-items:center;gap:8px;flex:1}
.df .in{letter-spacing:.03em}
.cal{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--accT);color:var(--acc);flex-shrink:0;font-size:17px}
.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.dh{font-size:12px;color:var(--hint);margin:-2px 0 4px}
.dh.bad{color:var(--dt)}
.leg{border:1px solid var(--sep);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.legh{display:flex;justify-content:space-between;font-size:12px;color:var(--hint)}
.more{display:flex;align-items:center;gap:6px;margin:4px 20px 8px;border:none;background:transparent;color:var(--acc);font-size:14px;font-weight:600;padding:6px 2px}
select{border:1px solid var(--sep);background:#fff;border-radius:8px;height:34px;padding:0 8px;font-size:14px}
.how{margin:0 16px 12px;border-radius:12px;padding:11px 13px;background:var(--accT);font-size:13px;line-height:1.45}
.how b{display:block;margin-bottom:4px;color:var(--acc)}

/* проверка */
.tk{margin:14px 16px 0;border-radius:16px;background:#fff;box-shadow:var(--sh);overflow:hidden}
.tkh{background:var(--acc);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tkh>div{min-width:0}
.tkc{font-size:30px;font-weight:800;letter-spacing:.04em;line-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkc.city{font-size:20px;letter-spacing:0;line-height:28px}
.tkn{font-size:12px;color:#D6E2F4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkh .r{text-align:right}
.tkh svg{flex-shrink:0}
.tear{position:relative;height:20px}
.tear i{position:absolute;top:0;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tear i:first-child{left:-10px}.tear i:nth-child(2){right:-10px}
.tear b{position:absolute;left:18px;right:18px;top:9px;border-top:2px dashed var(--sep);animation:tear 1s ease-out both .4s}
.tkg{padding:6px 18px 6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tkg div{min-width:0}
.tkg small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--hint);text-transform:uppercase}
.tkg span{display:block;font-size:13.5px;font-weight:600;margin-top:3px;word-wrap:break-word}
.tkf{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 12px}
.tkf .lnk{font-size:13.5px}
.urgb{font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;background:var(--db);color:var(--dt)}
.uph{padding:20px 22px 8px;display:flex;align-items:baseline;justify-content:space-between}
.uph b{font-size:16px;font-weight:800}
.uph span{font-size:12px;color:var(--hint)}
.ups{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.upc{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:#fff;border:1px solid var(--sep);text-align:left;width:100%;transition:border-color .15s,background .15s}
.upc img{height:16px;width:auto;flex-shrink:0}
.upc .t{flex:1;min-width:0}
.upc .t b{display:block;font-size:14px;font-weight:700}
.upc .t span{display:block;font-size:12px;color:var(--hint)}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--sep);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.cb svg{opacity:0;transition:opacity .15s}
.upc.on{border-color:var(--acc);background:#FAFCFF}
.upc.on .cb{background:var(--acc);border-color:var(--acc)}
.upc.on .cb svg{opacity:1}
.nh{margin:14px 16px 0;padding:12px 14px;border-radius:12px;background:var(--accT);font-size:12.5px;line-height:18px}
.phb{margin:18px 16px 0;border-radius:16px;background:#fff;border:2px solid var(--acc);padding:16px}
.phb h3{margin:0;font-size:16px;font-weight:800}
.phb p{margin:4px 0 0;font-size:13px;line-height:19px;color:var(--hint)}
.phb label{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:12.5px;line-height:18px;cursor:pointer}
.phb input{width:18px;height:18px;margin:0;accent-color:#164C9A;flex-shrink:0}
.phb a{color:var(--acc);font-weight:600}

/* готово */
#ok{background:#fff}
.okw{padding:56px 22px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.okr{position:relative;width:84px;height:84px}
.okr .rg{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:ring 1.6s ease-out infinite .6s}
.okr .ck{position:absolute;inset:0;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(22,76,154,.30);animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
.okr .ck path{stroke-dasharray:30;animation:draw .5s ease-out both .45s}
.okr.urg .rg{border-color:#D64545}.okr.urg .ck{background:#D64545;box-shadow:0 10px 28px rgba(214,69,69,.3)}
.okn{margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc);min-height:17px}
.okn.wait{animation:shim 1.2s infinite}
.okw h1{margin:8px 0 0;font-size:27px;line-height:33px;font-weight:800}
.team{margin:24px 16px 0;border-radius:16px;background:#fff;box-shadow:0 6px 22px rgba(11,44,94,.12);padding:16px;display:flex;align-items:center;gap:14px;text-align:left}
.avs{position:relative;display:flex;flex-shrink:0}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;border:2px solid #fff;letter-spacing:.02em}
.av+.av{margin-left:-12px}
.av.a1{background:linear-gradient(135deg,#3D7DD8,#164C9A)}
.av.a2{background:linear-gradient(135deg,#5A8FE0,#2A5FB0)}
.av.a3{background:linear-gradient(135deg,#164C9A,#0B2C5E);box-shadow:inset 0 0 0 2px rgba(245,178,26,.85)}
.avs .pulse{position:absolute;right:-1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ot);border:2px solid #fff}
.team b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.tdot{width:9px;height:9px;border-radius:50%;background:var(--ot);flex-shrink:0}
.team .nm{font-size:12px;color:var(--acc);font-weight:600;margin-top:1px}
.team .tx{font-size:13px;line-height:19px;color:var(--hint);margin-top:4px}
.okp{margin:14px 16px 0;font-size:13px;line-height:19px;color:var(--hint);text-align:left;padding:0 6px}
.off{margin:14px 16px 0;border-radius:14px;background:var(--accT);padding:16px;display:flex;gap:14px;align-items:center;text-align:left}
.off .t{flex:1;min-width:0}
.off img{height:16px;width:auto;display:block}
.off b{display:block;font-size:14px;font-weight:700;margin-top:6px}
.off span{display:block;font-size:12px;color:var(--hint)}
.off button{height:40px;padding:0 14px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.off button:disabled{background:var(--ot);opacity:1}

/* панели */
.qa{border-top:1px solid #EDF1F7}.qa:first-child{border-top:none}
.qa summary{list-style:none;padding:12px 0;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.qa summary::-webkit-details-marker{display:none}.qa summary::after{content:"▾";color:var(--hint)}.qa[open] summary::after{content:"▴"}

const FAQ = {"ru":[["💰 Сколько стоят ваши услуги?","Заявка и подбор вариантов бесплатные. Сервисный сбор — по нашему прайсу, менеджер назовёт его вместе с ценой билета. Итоговую сумму менеджер называет до оплаты, без скрытых доплат."],["📈 Почему цена на билет меняется?","Авиакомпании продают места по разным тарифам. Когда дешёвые места заканчиваются, цена растёт, иногда за несколько часов. Цену фиксирует бронь (если авиакомпания её позволяет) или выписка билета, поэтому лучше не откладывать."],["📌 Можно забронировать без оплаты?","Да, если авиакомпания и тариф это позволяют. Мы бронируем выбранный перелёт, и места с ценой сохраняются до срока брони — его назовёт менеджер. После оплаты выдаём электронный билет. Если не оплатить до срока, бронь снимается автоматически. Авиакомпания может снять бронь и раньше — если на рейсе осталось мало мест или изменился тариф. Место и цена гарантированы только после оплаты и выписки билета."],["🧳 «С багажом» и «без багажа»","«Без багажа» — только ручная кладь, её вес и размер зависят от авиакомпании. «С багажом» — ещё и чемодан в багажном отделении. Точные нормы менеджер укажет в каждом варианте."],["↩️ Возврат и обмен билета","Зависит от тарифа. Возвратные тарифы дороже, зато деньги можно вернуть (иногда за вычетом сбора). По невозвратным тарифам вернуть удаётся только часть или ничего. Условия менеджер сообщит до оплаты."],["🛂 Какие данные нужны для покупки?","ФИО латиницей как в паспорте, номер и срок действия паспорта, дата рождения каждого пассажира. Присылайте их только после того, как выберете вариант."],["📅 Сколько должен действовать паспорт?","Обычно не меньше 6 месяцев после возвращения. Многие страны не пускают с паспортом, который скоро истекает, — проверьте заранее."],["👶 Билеты для детей","Младенцы до 2 лет обычно летят без отдельного места и стоят дешевле. Для детей от 2 до 12 лет у многих авиакомпаний скидка. Укажите в форме возраст каждого ребёнка — менеджер посчитает точно."],["🎫 Как я получу билет?","Электронный билет придёт в этот чат файлом. Распечатывать не нужно, в аэропорту достаточно паспорта."],["🖥 Что такое онлайн-регистрация?","Регистрация на рейс на сайте авиакомпании, обычно за 24–48 часов до вылета. Она экономит время в аэропорту и даёт выбрать место. Если не получается — напишите нам, поможем."],["🌍 Поможете с визой и отелем?","Визы, отели, трансферы и туры оформляет наш партнёр ALFA TOUR. Напишите менеджеру — передадим ваш запрос."],["⏱ Как быстро вы отвечаете?","В рабочее время (Пн–Пт 10–18, Сб 10–16) — в течение 15 минут. Вечером, ночью и в выходные мы тоже на связи. Если вылет сегодня — отметьте «Срочно»."]],"uz":[["💰 Xizmatlaringiz qancha turadi?","Ariza va variantlarni tanlash bepul. Xizmat haqi — narxlarimiz ro‘yxatiga ko‘ra, menejer uni chipta narxi bilan birga aytadi. Yakuniy summa to‘lovdan oldin, yashirin to‘lovlarsiz aytiladi."],["📈 Nega chipta narxi o‘zgaradi?","Aviakompaniyalar joylarni turli tariflarda sotadi. Arzon joylar tugagach, narx oshadi — ba’zan bir necha soat ichida. Narxni bron (agar aviakompaniya ruxsat bersa) yoki chiptani rasmiylashtirish qayd etadi, shuning uchun kechiktirmagan ma’qul."],["📌 To‘lovsiz bron qilsa bo‘ladimi?","Ha, agar aviakompaniya va tarif ruxsat bersa. Tanlangan parvozni bron qilamiz, joylar va narx bron muddatigacha saqlanadi — muddatni menejer aytadi. To‘lovdan so‘ng elektron chipta beramiz. Muddatgacha to‘lanmasa, bron avtomatik bekor bo‘ladi. Aviakompaniya bronni undan oldin ham bekor qilishi mumkin — reysda joy kam qolsa yoki tarif o‘zgarsa. Joy va narx faqat to‘lov va chipta rasmiylashtirilgandan keyin kafolatlanadi."],["🧳 «Bagajli» va «bagajsiz»","«Bagajsiz» — faqat qo‘l yuki, uning vazni va o‘lchami aviakompaniyaga bog‘liq. «Bagajli» — qo‘shimcha ravishda bagaj bo‘limiga topshiriladigan chamadon. Aniq me’yorlarni menejer har bir variantda ko‘rsatadi."],["↩️ Chiptani qaytarish va almashtirish","Tarifga bog‘liq. Qaytariladigan tariflar qimmatroq, lekin pulni qaytarish mumkin (ba’zan jarima ushlab qolinadi). Qaytarilmaydigan tariflarda pulning faqat bir qismi qaytadi yoki umuman qaytmaydi. Shartlarni menejer to‘lovdan oldin aytadi."],["🛂 Xarid uchun qanday ma’lumotlar kerak?","Har bir yo‘lovchining pasportdagidek lotin harflarida F.I.Sh., pasport raqami va amal qilish muddati, tug‘ilgan sanasi. Ularni faqat variantni tanlaganingizdan keyin yuboring."],["📅 Pasport qancha amal qilishi kerak?","Odatda qaytgandan keyin kamida 6 oy. Ko‘p davlatlar muddati tugayotgan pasport bilan kiritmaydi — oldindan tekshiring."],["👶 Bolalar uchun chiptalar","2 yoshgacha bo‘lgan go‘daklar odatda alohida joysiz uchadi va arzonroq turadi. 2 yoshdan 12 yoshgacha bo‘lgan bolalarga ko‘p aviakompaniyalarda chegirma bor. Shaklda har bir bolaning yoshini ko‘rsating — menejer aniq hisoblaydi."],["🎫 Chiptani qanday olaman?","Elektron chipta shu chatga fayl ko‘rinishida keladi. Chop etish shart emas, aeroportda pasport kifoya."],["🖥 Onlayn ro‘yxatdan o‘tish nima?","Aviakompaniya saytida reysga ro‘yxatdan o‘tish, odatda parvozdan 24–48 soat oldin. U aeroportda vaqtni tejaydi va joy tanlash imkonini beradi. Uddalay olmasangiz — bizga yozing, yordam beramiz."],["🌍 Viza va mehmonxonada yordam berasizmi?","Viza, mehmonxona, transfer va turlarni hamkorimiz ALFA TOUR rasmiylashtiradi. Menejerga yozing — so‘rovingizni yetkazamiz."],["⏱ Qanchalik tez javob berasiz?","Ish vaqtida (Du–Ju 10–18, Sh 10–16) — 15 daqiqa ichida. Kechqurun, tunda va dam olish kunlari ham aloqadamiz. Parvoz bugun bo‘lsa — «Shoshilinch» deb belgilang."]],"en":[["💰 How much do your services cost?","Requests and finding options are free. The service fee follows our price list, and the manager states it together with the ticket price. You get the final amount before paying, with no hidden extras."],["📈 Why does the ticket price change?","Airlines sell seats at different fares. When the cheaper seats run out, the price goes up, sometimes within hours. The price is locked by a booking (if the airline allows it) or by issuing the ticket, so it’s best not to wait."],["📌 Can I book without paying?","Yes, if the airline and fare allow it. We book your chosen flight, and the seats and price are held until the booking deadline — the manager will tell you when. After payment we issue your e-ticket. If it isn’t paid by the deadline, the booking is cancelled automatically. The airline may also cancel it earlier — if few seats are left or the fare changes. Your seat and price are guaranteed only after payment and ticketing."],["🧳 “With baggage” vs “no baggage”","“No baggage” means carry-on only; its weight and size depend on the airline. “With baggage” adds a checked suitcase. The manager lists the exact allowances for each option."],["↩️ Refunds and changes","It depends on the fare. Refundable fares cost more, but you can get your money back (sometimes minus a fee). With non-refundable fares, only part of the money or nothing is returned. The manager explains the rules before you pay."],["🛂 What details do you need?","Each passenger’s full name in Latin letters exactly as in the passport, passport number and expiry date, and date of birth. Please send them only after you’ve chosen an option."],["📅 How long must my passport be valid?","Usually at least 6 months after your return. Many countries refuse entry with a passport that is about to expire — check in advance."],["👶 Tickets for children","Infants under 2 usually fly without their own seat and cost less. Many airlines give discounts for children aged 2 to 12. Enter each child’s age in the form, and the manager will calculate the exact price."],["🎫 How will I get my ticket?","Your e-ticket arrives in this chat as a file. No need to print it — your passport is enough at the airport."],["🖥 What is online check-in?","Checking in for your flight on the airline’s website, usually 24–48 hours before departure. It saves time at the airport and lets you choose a seat. If it doesn’t work, message us and we’ll help."],["🌍 Can you help with visas and hotels?","Visas, hotels, transfers and tours are handled by our partner ALFA TOUR. Message a manager and we’ll pass your request on."],["⏱ How fast do you reply?","During working hours (Mon–Fri 10–18, Sat 10–16) — within 15 minutes. We’re also available in the evening, at night and on weekends. If you’re flying today, mark your request “Urgent”."]]};

// ---------- Время Ташкента ----------
function tashParts() {
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(now);
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.find(x => x.type === 'weekday').value);
  const h = (+p.find(x => x.type === 'hour').value % 24) + (+p.find(x => x.type === 'minute').value) / 60;
  return { date, wd, h };
}
function period() {
  const { date, wd, h } = tashParts();
  if (h < 9) return 'night';
  if (HOL.includes(date)) return 'eve';
  if ((wd >= 1 && wd <= 5 && h >= 10 && h < 18) || (wd === 6 && h >= 10 && h < 16)) return 'open';
  return 'eve';
}
function today() { return new Date(tashParts().date + 'T00:00:00'); }

// ---------- Даты ----------
function mask(v) { const d = v.replace(/\D/g, '').slice(0, 8); let o = d.slice(0, 2); if (d.length > 2) o += '.' + d.slice(2, 4); if (d.length > 4) o += '.' + d.slice(4); return o; }
function parseD(v) { const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v || ''); if (!m) return null; const d = new Date(+m[3], +m[2] - 1, +m[1]); return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? d : null; }
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmt = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
function dateField(holder, onChange) {
  holder.innerHTML = '<input class="in" inputmode="numeric" maxlength="10"><label class="cal">📅<input type="date" tabindex="-1"></label>';
  const tx = holder.querySelector('.in'), c = holder.querySelector('input[type=date]');
  tx.placeholder = T[L].dPh;
  tx.addEventListener('input', () => { tx.value = mask(tx.value); onChange(); });
  c.addEventListener('change', () => { if (c.value) { const [y, m, d] = c.value.split('-'); tx.value = d + '.' + m + '.' + y; onChange(); } });
  return { tx, c };
}
function dateHint(el, v, min) {
  el.className = 'dh'; el.textContent = '';
  if (!v) return true;
  if (v.length < 10) return false;
  const d = parseD(v), t = T[L];

  $('okP').textContent = last.pay === 'cash' ? t.okCash : t.okQr;
  $('okHowBox').classList.toggle('hide', !!last.ins);
  // одно предложение: страховка, если не выбрана; иначе отель/трансфер
  const what = last.ins ? '' : !last.add.ins ? 'ins' : !last.add.tour ? 'tour' : '';
  $('off').classList.toggle('hide', !what);
  if (what) {
    $('off').dataset.v = what;
    $('offImg').classList.toggle('hide', what !== 'ins');
    $('offT').textContent = what === 'ins' ? t.offIns : t.offTour; $('offS').textContent = what === 'ins' ? t.offInsS : t.offTourS;
    const done = last.added[what];
    $('offB').textContent = done ? t.offOk : t.offAdd; $('offB').disabled = !!done || !last.id;
  }
}
function addOffer() {
  const what = $('off').dataset.v; if (!last || !last.id || !what) return;
  $('offB').disabled = true;
  api({ kind: 'addon', n: last.id, what }).then(j => {
    if (j && j.ok) { last.added[what] = true; haptic('ok'); }
    okFill();
  }).catch(() => okFill());
}

// ---------- Сервер ----------
const api = body => fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg.initData, lang: L }, body)) }).then(r => r.json());
let REGKEY = 'alfa_reg';
function isReg() { try { return localStorage.getItem(REGKEY) === '1'; } catch (e) { return false; } }
function setReg(v) { try { v ? localStorage.setItem(REGKEY, '1') : localStorage.removeItem(REGKEY); } catch (e) {} }

// ---------- Справочники и форма ----------
let formBuilt = false, buildP = null, QP, SRC = '', wantTrain = false, wantIns = false, wantNews = '';
function applyInit(j) {
  PL = j.places || []; ST = j.stations || [];
  if (Array.isArray(j.news)) { NEWS = j.news; if (cur === 'home') renderNews(); openWanted(); }
}
function openWanted() {
  if (!wantNews || !NEWS.length) return;
  const n = NEWS.find(x => x.id === wantNews); wantNews = '';
  if (n && cur === 'home') openNews(n);
}
function loadInit() {
  const KEY = 'alfa_fl_init';
  const load = () => fetch(API + '?a=init').then(r => r.json());
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  const fresh = load().then(j => { if (j.ok) { try { localStorage.setItem(KEY, JSON.stringify(j)); } catch (e) {} } return j; });
  if (cached && cached.places && cached.places.length) {
    applyInit(cached); // мгновенно из памяти телефона, свежие данные — в фоне
    fresh.then(j => { if (j.ok) { applyInit(j); if (formBuilt) renderHome(); } }).catch(() => {});
    return Promise.resolve(true);
  }
  return fresh.then(j => { if (!j.ok) return false; applyInit(j); return true; }).catch(() => false);
}
function buildForm() {
  if (formBuilt) return Promise.resolve(true);
  if (!buildP) buildP = loadInit().then(ok => { if (!ok) { buildP = null; return false; } wireForm(); return true; });
  return buildP;
}
function wireForm() {
  D1 = dateField($('df1'), () => { checkDates(); clr(); });
  D2 = dateField($('df2'), () => { checkDates(); clr(); });
  ID1 = dateField($('idf1'), () => { insCheck(); clr(); });
  ID2 = dateField($('idf2'), () => { insCheck(); clr(); });
  chips('insT', 0); chips('insP', 0); sw('insV');
  qs('[data-ic]').forEach(b => b.onclick = () => { const v = insN + +b.dataset.ic; if (v < 1 || v > 9) return; insN = v; $('insN').textContent = v; insAges(); clr(); });
  $('insC').oninput = clr;
  const fromDef = PL.find(p => p[3].includes('tas') && p[3].includes('ташкент'));
  if (fromDef && !$('from').value) setPlace($('from'), fromDef);
  attachAC($('from')); attachAC($('to'));
  legs = [{ f: $('from').value, fr: $('from').dataset.ru, t: '', tr: '', d: '' }, { f: '', fr: '', t: '', tr: '', d: '' }];
  $('ppMore').onclick = e => { e.preventDefault(); e.stopPropagation(); $('ppL').classList.toggle('hide'); };
  $('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (!TRAIN_ON && b.dataset.m === 'tr') { $('trSoonNote').classList.toggle('hide'); return; }
    if (b.dataset.m === M) return;
    qs('button', $('mode')).forEach(x => x.classList.remove('on')); b.classList.add('on'); M = b.dataset.m;
    const st = M === 'tr' ? ST.find(p => p[0] === 'Ташкент') : PL.find(p => p[3].includes('tas') && p[3].includes('ташкент'));
    $('from').value = st ? st[LI[L]] : ''; $('from').dataset.ru = st ? st[0] : ''; $('to').value = ''; $('to').dataset.ru = ''; applyMode(); renderFormHead(); };
  chips('trip', 0, syncTrip); chips('lay'); chips('tt'); chips('seatP'); chips('pay', 0, payHint);
  chips('dir', 1, () => $('layW').classList.toggle('hide', !on('dir').includes('via')));
  chips('add', 1, () => $('seatW').classList.toggle('hide', !on('add').includes('seat')));
  ['fare', 'cls', 'tcls', 'tm', 'ex'].forEach(i => chips(i, 1));
  sw('urg', () => $('urgBox').style.background = swOn('urg') ? 'var(--db)' : ''); sw('flx'); sw('fb');
  $('more').onclick = () => { moreOpen = !moreOpen; $('moreBox').classList.toggle('hide', !moreOpen); $('moreI').textContent = moreOpen ? '▴' : '▾'; $('moreT').textContent = moreOpen ? T[L].less : T[L].more; };
  qs('[data-c]').forEach(b => b.onclick = () => { const k = b.dataset.c, v = s[k] + +b.dataset.d; if (v < (k === 'ad' ? 1 : 0) || v > 9) return; s[k] = v; $(k).textContent = v; if (k === 'ch') ages(); clr(); });
  $('addLeg').onclick = () => { const p = legs[legs.length - 1]; legs.push({ f: p.t || '', fr: p.tr || '', t: '', tr: '', d: '' }); renderLegs(); };
  ['from', 'to'].forEach(i => $(i).addEventListener('change', () => { if (trip() !== 'mc') { legs[0].f = $('from').value; legs[0].fr = $('from').dataset.ru; } }));
  formBuilt = true;
  const want = M; M = 'pl';
  applyMode(); tr();
  if (want !== 'pl') setMode(want);
  if (cur === 'home') renderHome();
}

// ---------- Отрисовка новых экранов при смене языка ----------
function renderDyn() {
  if (formBuilt) relabel();
  if (cur === 'home') renderHome();
  if (cur === 'news') renderNewsView();
  if (cur === 'form') renderFormHead();
  if (cur === 'rv') renderRv();
  okFill(); renderPanel();
}

// ---------- Запуск ----------
function init() {
  QP = new URLSearchParams(location.search);
  try { const saved = localStorage.getItem('alfa_lang'); const lc = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
    if (saved && T[saved]) L = saved; else if (lc === 'uz' || lc === 'en') L = lc; } catch (e) {}
  if (T[QP.get('l')]) L = QP.get('l'); // язык из бота
  if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
  $('ldT').textContent = { ru: 'Загрузка…', uz: 'Yuklanmoqda…', en: 'Loading…' }[L];
  if (!tg || !tg.initData) return fatal(T[L].eAuth);
  const u = tg.initDataUnsafe.user || {};
  REGKEY = 'alfa_reg_' + (u.id || '');
  const sp = tg.initDataUnsafe.start_param || '';
  SRC = (QP.get('src') || sp || '').slice(0, 40);
  wantTrain = QP.get('m') === 'tr' || /^tr(ain)?(_|$)/i.test(sp);
  wantIns = QP.get('m') === 'ins' || /^ins(_|$)/i.test(sp);
  const nm = /^news_([\w-]+)$/.exec(sp) || /^news_([\w-]+)$/.exec(QP.get('n') ? 'news_' + QP.get('n') : '');
  wantNews = nm ? nm[1] : '';

  // общие кнопки
  qs('.lg').forEach(b => b.onclick = () => { L = b.dataset.l; haptic(); try { localStorage.setItem('alfa_lang', L); } catch (e) {} tr(); });
  qs('[data-pn]').forEach(b => b.onclick = () => openPanel(b.dataset.pn));
  try { tg.BackButton.onClick(goBack); } catch (e) {}
  qs('#htabs button').forEach(b => b.onclick = () => { haptic(); setMode(b.dataset.m); renderHome(); });
  $('hFrom').onclick = () => openForm(); $('hTo').onclick = () => openForm(true); $('hGo').onclick = () => openForm(true);
  $('hSwap').onclick = () => {
    if (!formBuilt) return; haptic(); $('hSwap').classList.toggle('spin');
    const a = $('from'), b = $('to'), v = a.value, r = a.dataset.ru; a.value = b.value; a.dataset.ru = b.dataset.ru || ''; b.value = v; b.dataset.ru = r || ''; renderHome();
  };
  $('corp').onclick = () => $('corpA').classList.toggle('hide');
  $('car').addEventListener('scroll', () => { carTouch = Date.now(); carDots(); }, { passive: true });
  $('car').addEventListener('touchstart', () => { carTouch = Date.now() + 4000; }, { passive: true });
  $('nGo').onclick = newsGo; $('nShare').onclick = shareNews;
  $('send').onclick = toNext;
  $('rvEdit').onclick = goBack; $('rvGo').onclick = submit;
  qs('.upc').forEach(b => b.onclick = () => { b.classList.toggle('on'); haptic(); });
  $('rvPol').onclick = e => { e.preventDefault(); openLink(POLICY_URL + '?l=' + L); };
  $('rvOk').onchange = () => { $('eRv').textContent = ''; };
  $('again').onclick = () => { try { tg.close(); } catch (e) {} };
  $('again2').onclick = () => { qs('.upc').forEach(b => b.classList.remove('on')); NEWS_REF = ''; home(); };
  $('offB').onclick = addOffer;
  document.addEventListener('click', e => { if (e.target.closest('.chip, .seg button, .sw, .cn button')) haptic(); }, true);

  if (wantIns) M = 'ins'; else if (wantTrain && TRAIN_ON) M = 'tr';
  tr();
  show('home');           // главная открывается сразу
  buildForm().then(ok => { if (ok) openWanted(); });
  carStart();
  setInterval(hdr, 60000);
  const view = QP.get('v');
  if (view === 'faq' || view === 'mgr' || view === 'priv') openPanel(view);

  // фоновая сверка с сервером: согласие могли отозвать или дать с другого устройства
  api({ kind: 'status' }).then(j => {
    if (!j || !j.ok) return;
    if (!!j.reg !== isReg()) { setReg(!!j.reg); if (cur === 'rv') renderRv(); if (cur === 'pn') renderPanel(); }
  }).catch(() => {});
}
init();
</script>
